name: MinDora AI Release APK Builder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      SITE_URL: "https://ghostbyteprotocol.github.io/mindora-ai/"
      APP_TITLE: "MinDora AI"
      PACKAGE_NAME: "com.mindora.ai.app"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and Java
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Initialize Capacitor Android wrapper
        run: |
          mkdir -p mobile-app/www
          echo "<!doctype html><html><body><p>Opening MinDora AI...</p></body></html>" > mobile-app/www/index.html
          cd mobile-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat <<EOF > capacitor.config.json
          {
            "appId": "$PACKAGE_NAME",
            "appName": "$APP_TITLE",
            "webDir": "www",
            "server": {
              "url": "$SITE_URL",
              "cleartext": false
            }
          }
          EOF
          npx cap add android

      - name: Generate clean PNG app icons from logo.png
        run: |
          python3 -c '
          import os, struct, zlib

          source_logo = "logo.png"
          res_root = "mobile-app/android/app/src/main/res"
          mipmap_sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          def fallback_png(width, height, color=(15, 23, 42, 255)):
              def make_chunk(chunk_type, chunk_data):
                  crc = zlib.crc32(chunk_type + chunk_data) & 0xffffffff
                  return struct.pack("!I", len(chunk_data)) + chunk_type + chunk_data + struct.pack("!I", crc)
              ihdr = struct.pack("!IIBBBBB", width, height, 8, 6, 0, 0, 0)
              scanline = bytes(color) * width
              raw_rows = b"".join(b"\x00" + scanline for _ in range(height))
              compressed = zlib.compress(raw_rows, level=9)
              return b"\x89PNG\r\n\x1a\n" + make_chunk(b"IHDR", ihdr) + make_chunk(b"IDAT", compressed) + make_chunk(b"IEND", b"")

          pil_img = None
          try:
              from PIL import Image
              if os.path.exists(source_logo):
                  pil_img = Image.open(source_logo).convert("RGBA")
          except Exception:
              pil_img = None

          for current_root, _, file_list in os.walk(res_root):
              if "mipmap-anydpi-v26" in current_root:
                  for fname in file_list:
                      if fname.startswith("ic_launcher") and fname.endswith(".xml"):
                          try:
                              os.remove(os.path.join(current_root, fname))
                          except OSError:
                              pass

          for folder, px in mipmap_sizes.items():
              target_folder = os.path.join(res_root, folder)
              os.makedirs(target_folder, exist_ok=True)
              for icon_file in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                  dest_file = os.path.join(target_folder, icon_file)
                  if pil_img is not None:
                      pil_img.resize((px, px)).save(dest_file, format="PNG")
                  else:
                      with open(dest_file, "wb") as out:
                          out.write(fallback_png(px, px))
          '

      - name: Configure microphone and audio permissions
        run: |
          MANIFEST_FILE="mobile-app/android/app/src/main/AndroidManifest.xml"
          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>/' "$MANIFEST_FILE"

      - name: Assemble and sign release APK
        run: |
          cd mobile-app/android/app
          keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mindora_key -storepass mindora123 -keypass mindora123 -dname "CN=MinDora AI, OU=CSE, O=MinDora, L=Purulia, S=WB, C=IN"
          cd ..
          ./gradlew assembleRelease --stacktrace
          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER_BIN" sign --ks app/release-key.jks --ks-pass pass:mindora123 --key-pass pass:mindora123 --out ../../MinDora-AI-Release.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0-release --yes || true
          gh release create v1.0.0-release MinDora-AI-Release.apk \
            --title "MinDora AI — Official Release APK" \
            --notes "Auto-updating Android release APK connected to https://ghostbyteprotocol.github.io/mindora-ai/."
