name: Auto Build MinDora Release APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      SITE_URL: "https://ghostbyteprotocol.github.io/mindora-ai/"
      APP_TITLE: "MinDora AI"
      PACKAGE_NAME: "com.mindora.ai.app"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and Java
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Initialize Capacitor Android wrapper
        run: |
          mkdir -p mobile-app/www
          echo "<!doctype html><html><body style='background:#080b14;color:#fff'><h3>Loading MinDora AI...</h3></body></html>" > mobile-app/www/index.html
          cd mobile-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat <<EOF > capacitor.config.json
          {
            "appId": "$PACKAGE_NAME",
            "appName": "$APP_TITLE",
            "webDir": "www",
            "server": {
              "url": "$SITE_URL",
              "cleartext": false
            }
          }
          EOF
          npx cap add android

      - name: Apply visible logo.png as Android Launcher Icon
        run: |
          python3 -c '
          import os, shutil
          from PIL import Image, ImageEnhance

          source_logo = "logo.png"
          res_root = "mobile-app/android/app/src/main/res"
          mipmap_sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          # Remove adaptive icon XMLs so Android strictly renders our PNG launcher icons
          for entry in os.listdir(res_root):
              full_path = os.path.join(res_root, entry)
              if entry.startswith("mipmap-anydpi") and os.path.isdir(full_path):
                  shutil.rmtree(full_path, ignore_errors=True)

          img = Image.open(source_logo).convert("RGBA")
          bbox = img.getbbox()
          if bbox:
              img = img.crop(bbox)

          # Boost brightness slightly and place centered on a vibrant indigo-cyan card
          img = ImageEnhance.Brightness(img).enhance(1.25)

          for folder, px in mipmap_sizes.items():
              target_folder = os.path.join(res_root, folder)
              os.makedirs(target_folder, exist_ok=True)
              for xml_name in ["ic_launcher.xml", "ic_launcher_round.xml"]:
                  xml_path = os.path.join(target_folder, xml_name)
                  if os.path.exists(xml_path):
                      os.remove(xml_path)

              canvas = Image.new("RGBA", (px, px), (18, 28, 56, 255))
              pad = max(4, int(px * 0.12))
              inner_size = px - (pad * 2)
              resized_logo = img.resize((inner_size, inner_size), Image.Resampling.LANCZOS)
              canvas.paste(resized_logo, (pad, pad), resized_logo)

              for icon_file in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                  canvas.save(os.path.join(target_folder, icon_file), format="PNG")
          '

      - name: Configure Manifest Icons & Mic Permissions
        run: |
          MANIFEST_FILE="mobile-app/android/app/src/main/AndroidManifest.xml"
          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>/' "$MANIFEST_FILE"

      - name: Assemble and sign release APK
        run: |
          cd mobile-app/android/app
          keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mindora_key -storepass mindora123 -keypass mindora123 -dname "CN=MinDora AI, OU=CSE, O=MinDora, L=Purulia, S=WB, C=IN"
          cd ..
          ./gradlew assembleRelease --stacktrace
          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER_BIN" sign --ks app/release-key.jks --ks-pass pass:mindora123 --key-pass pass:mindora123 --out ../../MinDora-AI-Release.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Auto-Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes || true
          gh release create latest-apk MinDora-AI-Release.apk \
            --title "MinDora AI — Latest Release APK" \
            --notes "Auto-built signed Release APK with app logo and live updates from https://ghostbyteprotocol.github.io/mindora-ai/."
