name: Auto Build MinDora Release APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      SITE_URL: "https://ghostbyteprotocol.github.io/mindora-ai/"
      APP_TITLE: "MinDora AI"
      PACKAGE_NAME: "com.mindora.ai.app"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and Java 17
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Python Pillow for App Icon Generation
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Create Capacitor Live-Sync Android App
        run: |
          mkdir -p mobile-app/www
          cat <<EOF > mobile-app/www/index.html
          <!doctype html>
          <html>
            <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
            <body style="background:#080b14;color:#38bdf8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
              <h3>Loading MinDora AI...</h3>
            </body>
          </html>
          EOF
          cd mobile-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat <<EOF > capacitor.config.json
          {
            "appId": "$PACKAGE_NAME",
            "appName": "$APP_TITLE",
            "webDir": "www",
            "server": {
              "url": "$SITE_URL",
              "cleartext": false,
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android

      - name: Apply logo.png to All Android Launcher Icons
        run: |
          python3 -c '
          import os, shutil
          from PIL import Image

          src = "logo.png"
          res_dir = "mobile-app/android/app/src/main/res"
          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          if not os.path.exists(src):
              raise FileNotFoundError("logo.png not found in repository root!")

          # Remove adaptive icon XMLs so Android uses our exact PNG logo
          for folder in os.listdir(res_dir):
              full = os.path.join(res_dir, folder)
              if folder.startswith("mipmap-anydpi") and os.path.isdir(full):
                  shutil.rmtree(full, ignore_errors=True)

          logo = Image.open(src).convert("RGBA")

          for folder, size in densities.items():
              out_dir = os.path.join(res_dir, folder)
              os.makedirs(out_dir, exist_ok=True)
              for xml_file in ["ic_launcher.xml", "ic_launcher_round.xml"]:
                  p = os.path.join(out_dir, xml_file)
                  if os.path.exists(p):
                      os.remove(p)

              resized = logo.resize((size, size), Image.Resampling.LANCZOS)
              for png_name in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                  resized.save(os.path.join(out_dir, png_name), format="PNG")

          print("Successfully applied logo.png to all mipmap densities!")
          '

      - name: Add Microphone & Audio Permissions
        run: |
          python3 -c '
          manifest = "mobile-app/android/app/src/main/AndroidManifest.xml"
          with open(manifest, "r") as f:
              content = f.read()
          perms = """<uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />"""
          content = content.replace("<uses-permission android:name=\"android.permission.INTERNET\" />", perms, 1)
          with open(manifest, "w") as f:
              f.write(content)
          '

      - name: Build, Zipalign & Sign Release APK
        run: |
          cd mobile-app/android/app
          keytool -genkey -v -keystore mindora-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mindora -storepass mindora123 -keypass mindora123 -dname "CN=MinDora AI, OU=CSE, O=MinDora, L=Purulia, S=WB, C=IN"
          cd ..
          ./gradlew assembleRelease

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks app/mindora-release.jks --ks-pass pass:mindora123 --key-pass pass:mindora123 --out ../../MinDora-AI-Release.apk app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify ../../MinDora-AI-Release.apk

      - name: Auto-Publish Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MinDora AI — Official Release APK
          body: "Signed Release APK with custom app logo and automatic live sync from https://ghostbyteprotocol.github.io/mindora-ai/."
          files: MinDora-AI-Release.apk
