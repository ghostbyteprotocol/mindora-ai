<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ayan AI — Personal Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .chat-scroll::-webkit-scrollbar { width: 5px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    .prose pre { background: #1e293b; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 0.85rem; }
    .prose code { color: #38bdf8; }
    .pulse-ring { animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0b0f19]">
    <div class="glass w-full max-w-md rounded-2xl p-6 shadow-2xl">
      <div class="text-center mb-6">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center text-2xl font-bold text-white shadow-lg mb-3">
          <i class="fa-solid fa-sparkles"></i>
        </div>
        <h1 class="text-2xl font-bold text-white">Ayan AI</h1>
        <p class="text-xs text-slate-400 mt-1">তোর পার্সোনাল AI অ্যাসিস্ট্যান্ট</p>
      </div>

      <div id="auth-error" class="hidden mb-4 p-3 rounded-lg bg-red-500/20 border border-red-500/50 text-red-300 text-xs"></div>
      <div id="auth-msg" class="hidden mb-4 p-3 rounded-lg bg-emerald-500/20 border border-emerald-500/50 text-emerald-300 text-xs"></div>

      <!-- Email Form -->
      <form id="email-auth-form" class="space-y-3">
        <div id="name-field" class="hidden">
          <input type="text" id="auth-name" placeholder="তোর নাম" class="w-full px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700 text-sm focus:outline-none focus:border-blue-500" />
        </div>
        <input type="email" id="auth-email" required placeholder="ইমেইল অ্যাড্রেস" class="w-full px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700 text-sm focus:outline-none focus:border-blue-500" />
        <input type="password" id="auth-password" required placeholder="পাসওয়ার্ড" class="w-full px-4 py-3 rounded-xl bg-slate-900/90 border border-slate-700 text-sm focus:outline-none focus:border-blue-500" />
        
        <div class="flex justify-between items-center text-xs">
          <button type="button" id="toggle-auth-mode" class="text-blue-400 hover:underline">নতুন অ্যাকাউন্ট খুলবি? Sign Up</button>
          <button type="button" id="forgot-pass-btn" class="text-slate-400 hover:text-white">Forgot Password?</button>
        </div>

        <button type="submit" id="auth-submit-btn" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 font-semibold text-white text-sm transition">
          Login কর
        </button>
      </form>

      <div class="relative my-5 text-center">
        <div class="border-t border-slate-800"></div>
        <span class="bg-[#111827] px-3 text-xs text-slate-500 relative -top-2.5">অথবা</span>
      </div>

      <!-- Social Auth (Google & Apple) -->
      <div class="space-y-2.5">
        <button id="google-login-btn" class="w-full py-2.5 px-4 rounded-xl bg-white text-slate-900 font-semibold text-sm flex items-center justify-center gap-2 hover:bg-slate-100 transition">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-4 h-4" alt="G" />
          Continue with Google
        </button>
        <button id="apple-login-btn" class="w-full py-2.5 px-4 rounded-xl bg-slate-800 text-white border border-slate-700 font-semibold text-sm flex items-center justify-center gap-2 hover:bg-slate-700 transition">
          <i class="fa-brands fa-apple text-base"></i>
          Continue with Apple
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="app-screen" class="hidden flex-1 flex h-full overflow-hidden">
    
    <!-- SIDEBAR (Chats + Memory) -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-72 glass border-r border-slate-800 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-200">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white"><i class="fa-solid fa-robot"></i></span>
          <span class="font-bold text-white">Ayan AI</span>
        </div>
        <button id="close-sidebar" class="md:hidden text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="p-3">
        <button id="new-chat-btn" class="w-full py-2.5 px-3 rounded-xl bg-blue-600/20 border border-blue-500/40 text-blue-300 hover:bg-blue-600/30 text-sm font-medium flex items-center gap-2 transition">
          <i class="fa-solid fa-plus"></i> নতুন চ্যাট
        </button>
      </div>

      <!-- Chat History List -->
      <div class="flex-1 overflow-y-auto px-3 space-y-1 chat-scroll" id="chat-list"></div>

      <!-- Memory Box -->
      <div class="p-3 border-t border-slate-800 bg-slate-900/50">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-xs font-semibold text-cyan-400"><i class="fa-solid fa-brain mr-1"></i> AI Memory</span>
          <button id="save-memory-btn" class="text-[11px] bg-cyan-600/30 text-cyan-300 px-2 py-0.5 rounded hover:bg-cyan-600/50">Save</button>
        </div>
        <textarea id="memory-input" rows="3" placeholder="তোর ব্যাপারে যা মনে রাখতে চাস এখানে লেখ (যেমন: আমি অয়ন, CSE স্টুডেন্ট, বাংলায় কথা বলতে ভালোবাসি)..." class="w-full p-2 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-300 focus:outline-none focus:border-cyan-500"></textarea>
      </div>

      <!-- User Profile & Logout -->
      <div class="p-3 border-t border-slate-800 flex items-center justify-between">
        <div class="truncate pr-2">
          <p id="user-display-name" class="text-xs font-semibold text-white truncate">User</p>
          <p id="user-display-email" class="text-[10px] text-slate-400 truncate">email</p>
        </div>
        <button id="logout-btn" title="Logout" class="p-2 rounded-lg bg-red-500/10 text-red-400 hover:bg-red-500/20 text-xs">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- CHAT AREA -->
    <main class="flex-1 flex flex-col h-full bg-[#0b0f19] relative">
      <!-- Top Header -->
      <header class="h-14 glass border-b border-slate-800 px-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button id="open-sidebar" class="md:hidden text-slate-300 hover:text-white"><i class="fa-solid fa-bars text-lg"></i></button>
          <select id="model-select" class="bg-slate-900 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none">
            <option value="gemini-3.8-flash">Gemini 3.8 Flash (Latest)</option>
            <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (High Limit)</option>
            <option value="gemini-4-hydrogen">Gemini 4 Hydrogen</option>
          </select>
        </div>

        <button id="live-talk-btn" class="px-3 py-1.5 rounded-full bg-gradient-to-r from-emerald-600 to-teal-500 text-white text-xs font-semibold flex items-center gap-1.5 shadow hover:opacity-90 transition">
          <i class="fa-solid fa-headset"></i> Live Talk
        </button>
      </header>

      <!-- Messages Container -->
      <div id="messages-box" class="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll">
        <div class="text-center text-slate-500 text-xs my-10">
          <i class="fa-solid fa-wand-magic-sparkles text-2xl text-blue-500 mb-2 block"></i>
          কী সাহায্য লাগবে বল ভাই? ছবি পাঠা, ইউটিউব লিংক দে, বা লাইভ কথা বল!
        </div>
      </div>

      <!-- Attachment Preview -->
      <div id="attachment-preview" class="hidden px-4 py-2 bg-slate-900/90 border-t border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2 text-xs text-cyan-300">
          <img id="preview-img" class="hidden w-10 h-10 object-cover rounded" />
          <span id="preview-text">File attached</span>
        </div>
        <button id="clear-attachment" class="text-red-400 text-xs hover:underline">Remove</button>
      </div>

      <!-- Input Bar -->
      <div class="p-3 glass border-t border-slate-800">
        <div class="max-w-3xl mx-auto flex items-end gap-2">
          <!-- Image Upload -->
          <label class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 cursor-pointer transition" title="ছবি পাঠা">
            <i class="fa-solid fa-image"></i>
            <input type="file" id="image-input" accept="image/*" class="hidden" />
          </label>

          <!-- Generate Image Quick Button -->
          <button id="gen-img-mode-btn" title="ছবি তৈরি কর" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-purple-400 transition">
            <i class="fa-solid fa-palette"></i>
          </button>

          <textarea id="chat-input" rows="1" placeholder="এখানে লেখ বা YouTube লিংক পেস্ট কর..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 resize-none max-h-32"></textarea>

          <!-- Mic Button -->
          <button id="mic-btn" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition" title="ভয়েস টাইপিং">
            <i class="fa-solid fa-microphone"></i>
          </button>

          <!-- Send Button -->
          <button id="send-btn" class="p-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold transition">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- LIVE VOICE TALK OVERLAY -->
  <div id="live-overlay" class="hidden fixed inset-0 z-50 bg-[#0b0f19]/95 backdrop-blur-xl flex flex-col items-center justify-center p-6 text-center">
    <div id="live-orb" class="w-28 h-28 rounded-full bg-gradient-to-tr from-blue-600 via-cyan-400 to-emerald-400 flex items-center justify-center text-4xl text-white shadow-2xl mb-6 pulse-ring">
      <i class="fa-solid fa-waveform-lines"></i>
    </div>
    <h2 class="text-xl font-bold text-white mb-2">Live Voice Mode</h2>
    <p id="live-status" class="text-sm text-cyan-300 max-w-md mb-8">শুনছি... কথা বল ভাই</p>
    <button id="close-live-btn" class="px-6 py-3 rounded-full bg-red-600 hover:bg-red-500 text-white font-semibold text-sm shadow-lg">
      <i class="fa-solid fa-phone-slash mr-2"></i> কথা শেষ কর
    </button>
  </div>

  <!-- FIREBASE & APP LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
      getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, 
      sendPasswordResetEmail, GoogleAuthProvider, OAuthProvider, signInWithPopup, signOut, updateProfile 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { 
      getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAQSNDMA1JLHll5mMjSwXDSa0cAmjw8Bo4",
      authDomain: "my-website-login-10b06.firebaseapp.com",
      projectId: "my-website-login-10b06",
      storageBucket: "my-website-login-10b06.firebasestorage.app",
      messagingSenderId: "1058420080529",
      appId: "1:1058420080529:web:1440b3f78f8853268b2430",
      measurementId: "G-WCV8VCP27D"
    };

    // Gemini API Key
    const GEMINI_API_KEY = "AQ.Ab8RN6Ip8KhGfIgkqUmyRdDWaMMH2PGYL5xMCGaVPa_82CLhzg";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentChatId = null;
    let chatHistory = [];
    let userMemory = "";
    let attachedImageBase64 = null;
    let attachedImageMime = null;
    let isSignUp = false;
    let isLiveMode = false;

    // DOM Elements
    const authScreen = document.getElementById("auth-screen");
    const appScreen = document.getElementById("app-screen");
    const authError = document.getElementById("auth-error");
    const authMsg = document.getElementById("auth-msg");
    const messagesBox = document.getElementById("messages-box");
    const chatInput = document.getElementById("chat-input");

    // Toggle Login / Sign Up
    document.getElementById("toggle-auth-mode").onclick = () => {
      isSignUp = !isSignUp;
      document.getElementById("name-field").classList.toggle("hidden", !isSignUp);
      document.getElementById("auth-submit-btn").textContent = isSignUp ? "Sign Up কর" : "Login কর";
      document.getElementById("toggle-auth-mode").textContent = isSignUp ? "আগে থেকেই অ্যাকাউন্ট আছে? Login" : "নতুন অ্যাকাউন্ট খুলবি? Sign Up";
    };

    // Email Auth Submit
    document.getElementById("email-auth-form").onsubmit = async (e) => {
      e.preventDefault();
      authError.classList.add("hidden");
      const email = document.getElementById("auth-email").value.trim();
      const pass = document.getElementById("auth-password").value;
      const name = document.getElementById("auth-name").value.trim();
      try {
        if (isSignUp) {
          const cred = await createUserWithEmailAndPassword(auth, email, pass);
          if (name) await updateProfile(cred.user, { displayName: name });
        } else {
          await signInWithEmailAndPassword(auth, email, pass);
        }
      } catch (err) {
        authError.textContent = err.message;
        authError.classList.remove("hidden");
      }
    };

    // Forgot Password
    document.getElementById("forgot-pass-btn").onclick = async () => {
      const email = document.getElementById("auth-email").value.trim();
      if (!email) {
        authError.textContent = "আগে ইমেইল বক্সে তোর ইমেইলটা লেখ!";
        authError.classList.remove("hidden");
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        authMsg.textContent = "পাসওয়ার্ড রিসেট লিংক তোর ইমেইলে পাঠানো হয়েছে!";
        authMsg.classList.remove("hidden");
      } catch (err) {
        authError.textContent = err.message;
        authError.classList.remove("hidden");
      }
    };

    // Google Login
    document.getElementById("google-login-btn").onclick = async () => {
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch (err) {
        authError.textContent = err.message;
        authError.classList.remove("hidden");
      }
    };

    // Apple Login
    document.getElementById("apple-login-btn").onclick = async () => {
      try {
        await signInWithPopup(auth, new OAuthProvider("apple.com"));
      } catch (err) {
        authError.textContent = "Apple Login Error: " + err.message;
        authError.classList.remove("hidden");
      }
    };

    // Logout
    document.getElementById("logout-btn").onclick = () => signOut(auth);

    // Sidebar Mobile Toggle
    document.getElementById("open-sidebar").onclick = () => document.getElementById("sidebar").classList.remove("-translate-x-full");
    document.getElementById("close-sidebar").onclick = () => document.getElementById("sidebar").classList.add("-translate-x-full");

    // Auth State Listener
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        authScreen.classList.add("hidden");
        appScreen.classList.remove("hidden");
        document.getElementById("user-display-name").textContent = user.displayName || "Ayan";
        document.getElementById("user-display-email").textContent = user.email;
        await loadMemory();
        loadChatList();
      } else {
        currentUser = null;
        authScreen.classList.remove("hidden");
        appScreen.classList.add("hidden");
      }
    });

    // Load & Save Memory
    async function loadMemory() {
      const memRef = doc(db, "users", currentUser.uid, "settings", "memory");
      const snap = await getDoc(memRef);
      if (snap.exists()) {
        userMemory = snap.data().text || "";
        document.getElementById("memory-input").value = userMemory;
      }
    }

    document.getElementById("save-memory-btn").onclick = async () => {
      userMemory = document.getElementById("memory-input").value.trim();
      await setDoc(doc(db, "users", currentUser.uid, "settings", "memory"), { text: userMemory });
      alert("মেমোরি সেভ হয়ে গেছে ভাই!");
    };

    // Load Chat Sessions
    function loadChatList() {
      const q = query(collection(db, "users", currentUser.uid, "chats"), orderBy("updatedAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const list = document.getElementById("chat-list");
        list.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const btn = document.createElement("button");
          btn.className = `w-full text-left px-3 py-2 rounded-lg text-xs truncate transition ${currentChatId === docSnap.id ? "bg-slate-800 text-white font-semibold" : "text-slate-400 hover:bg-slate-800/50"}`;
          btn.textContent = data.title || "নতুন চ্যাট";
          btn.onclick = () => openChat(docSnap.id);
          list.appendChild(btn);
        });
      });
    }

    // New Chat
    document.getElementById("new-chat-btn").onclick = () => {
      currentChatId = null;
      chatHistory = [];
      messagesBox.innerHTML = `<div class="text-center text-slate-500 text-xs my-10">নতুন চ্যাট শুরু হলো। বল কী জানতে চাস?</div>`;
      document.getElementById("sidebar").classList.add("-translate-x-full");
    };

    // Open Existing Chat
    async function openChat(chatId) {
      currentChatId = chatId;
      document.getElementById("sidebar").classList.add("-translate-x-full");
      const msgRef = query(collection(db, "users", currentUser.uid, "chats", chatId, "messages"), orderBy("createdAt", "asc"));
      onSnapshot(msgRef, (snap) => {
        messagesBox.innerHTML = "";
        chatHistory = [];
        snap.forEach((d) => {
          const m = d.data();
          renderMessage(m.role, m.text, m.imageUrl);
          chatHistory.push({ role: m.role === "user" ? "user" : "model", parts: [{ text: m.text }] });
        });
      });
    }

    // Image Attachment Handling
    document.getElementById("image-input").onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        attachedImageBase64 = reader.result.split(",")[1];
        attachedImageMime = file.type;
        document.getElementById("preview-img").src = reader.result;
        document.getElementById("preview-img").classList.remove("hidden");
        document.getElementById("preview-text").textContent = file.name;
        document.getElementById("attachment-preview").classList.remove("hidden");
      };
      reader.readAsDataURL(file);
    };

    document.getElementById("clear-attachment").onclick = () => {
      attachedImageBase64 = null;
      attachedImageMime = null;
      document.getElementById("attachment-preview").classList.add("hidden");
    };

    // Quick Image Gen Prompt Helper
    document.getElementById("gen-img-mode-btn").onclick = () => {
      chatInput.value = "/imagine ";
      chatInput.focus();
    };

    // Render Message in UI
    function renderMessage(role, text, imageUrl = null) {
      const isUser = role === "user";
      const wrap = document.createElement("div");
      wrap.className = `flex ${isUser ? "justify-end" : "justify-start"}`;
      
      let imgHtml = imageUrl ? `<img src="${imageUrl}" class="max-w-xs rounded-xl mb-2 border border-slate-700" />` : "";
      let bodyHtml = isUser ? `<p class="whitespace-pre-wrap">${text}</p>` : `<div class="prose prose-invert max-w-none text-sm">${marked.parse(text)}</div>`;

      wrap.innerHTML = `
        <div class="max-w-[85%] md:max-w-[70%] rounded-2xl px-4 py-3 text-sm shadow ${isUser ? "bg-blue-600 text-white" : "glass text-slate-200"}">
          ${imgHtml}
          ${bodyHtml}
        </div>
      `;
      messagesBox.appendChild(wrap);
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    // Call Gemini API with Auto-Fallback
    async function askGemini(promptText, imgBase64, imgMime) {
      const selectedModel = document.getElementById("model-select").value;
      const modelsToTry = [selectedModel, "gemini-3.5-flash-lite"];

      const systemInstruction = `তুই ইউজারের জিগরি দোস্ত এবং পার্সোনাল AI অ্যাসিস্ট্যান্ট। ইউজারের সাথে তুই-তোকারি করে, সহজ বাংলা ও ইংরেজি মিশিয়ে বন্ধুর মতো কথা বলবি।
      ইউজারের সেভ করা মেমোরি: ${userMemory || "ইউজারের নাম অয়ন, ও একজন CSE স্টুডেন্ট।"}`;

      const userParts = [{ text: promptText }];
      if (imgBase64) {
        userParts.push({ inline_data: { mime_type: imgMime, data: imgBase64 } });
      }

      const contents = [...chatHistory.slice(-10), { role: "user", parts: userParts }];

      for (const model of modelsToTry) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              system_instruction: { parts: [{ text: systemInstruction }] },
              contents: contents
            })
          });
          const data = await res.json();
          if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
            return data.candidates[0].content.parts[0].text;
          }
        } catch (e) {
          console.warn("Model fallback triggered:", model, e);
        }
      }
      return "সরি ভাই, এই মুহূর্তে সার্ভার একটু ব্যস্ত আছে বা API কোটা শেষ হয়েছে। একটু পর আবার ট্রাই কর!";
    }

    // Send Message Handler
    async function handleSend(overrideText = null) {
      const text = (overrideText || chatInput.value).trim();
      if (!text && !attachedImageBase64) return;

      chatInput.value = "";
      const tempImgBase64 = attachedImageBase64;
      const tempImgMime = attachedImageMime;
      const previewSrc = tempImgBase64 ? `data:${tempImgMime};base64,${tempImgBase64}` : null;

      attachedImageBase64 = null;
      document.getElementById("attachment-preview").classList.add("hidden");

      // Create Chat Doc if new
      if (!currentChatId) {
        const newDoc = await addDoc(collection(db, "users", currentUser.uid, "chats"), {
          title: text.slice(0, 30) || "Image Chat",
          updatedAt: serverTimestamp()
        });
        currentChatId = newDoc.id;
      }

      // Save & Render User Message
      renderMessage("user", text || "ছবিটা দেখ তো", previewSrc);
      await addDoc(collection(db, "users", currentUser.uid, "chats", currentChatId, "messages"), {
        role: "user",
        text: text || "ছবিটা দেখ তো",
        createdAt: serverTimestamp()
      });

      // Check Image Generation Command
      if (text.toLowerCase().startsWith("/imagine ")) {
        const imgPrompt = text.slice(9).trim();
        const genUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(imgPrompt)}?width=768&height=768&nologo=true`;
        const reply = `এই নে ভাই, তোর **"${imgPrompt}"** ছবি তৈরি করে দিয়েছি!`;
        renderMessage("model", reply, genUrl);
        await addDoc(collection(db, "users", currentUser.uid, "chats", currentChatId, "messages"), {
          role: "model", text: reply, imageUrl: genUrl, createdAt: serverTimestamp()
        });
        return;
      }

      // Auto-Memory Detection ("মনে রাখবি" / "remember")
      if (text.includes("মনে রাখ") || text.toLowerCase().includes("remember")) {
        userMemory = (userMemory + "\n- " + text).trim();
        document.getElementById("memory-input").value = userMemory;
        await setDoc(doc(db, "users", currentUser.uid, "settings", "memory"), { text: userMemory });
      }

      // AI Typing Indicator
      const loadingDiv = document.createElement("div");
      loadingDiv.className = "text-xs text-cyan-400 animate-pulse";
      loadingDiv.textContent = "ভাবছি ভাই...";
      messagesBox.appendChild(loadingDiv);

      const aiReply = await askGemini(text || "এই ছবিটা বিস্তারিত বুঝিয়ে বল", tempImgBase64, tempImgMime);
      loadingDiv.remove();

      renderMessage("model", aiReply);
      await addDoc(collection(db, "users", currentUser.uid, "chats", currentChatId, "messages"), {
        role: "model", text: aiReply, createdAt: serverTimestamp()
      });

      if (isLiveMode) speakText(aiReply);
    }

    document.getElementById("send-btn").onclick = () => handleSend();
    chatInput.onkeydown = (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    };

    // Voice Recognition & Live Talk Mode
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = SpeechRecognition ? new SpeechRecognition() : null;
    if (recognition) {
      recognition.lang = "bn-IN";
      recognition.continuous = false;
      recognition.onresult = (event) => {
        const spoken = event.results[0][0].transcript;
        if (isLiveMode) {
          document.getElementById("live-status").textContent = "তুই বললি: " + spoken;
          handleSend(spoken);
        } else {
          chatInput.value = spoken;
        }
      };
      recognition.onend = () => {
        if (isLiveMode && !window.speechSynthesis.speaking) {
          try { recognition.start(); } catch(e) {}
        }
      };
    }

    function speakText(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/[*#`_]/g, "");
      const utter = new SpeechSynthesisUtterance(cleanText);
      utter.lang = "bn-IN";
      utter.onend = () => {
        if (isLiveMode && recognition) {
          document.getElementById("live-status").textContent = "শুনছি... আবার বল ভাই";
          try { recognition.start(); } catch(e) {}
        }
      };
      window.speechSynthesis.speak(utter);
    }

    document.getElementById("mic-btn").onclick = () => {
      if (!recognition) return alert("তোর ব্রাউজারে ভয়েস সাপোর্ট নেই!");
      recognition.start();
    };

    document.getElementById("live-talk-btn").onclick = () => {
      if (!recognition) return alert("তোর ব্রাউজারে Live Voice সাপোর্ট নেই!");
      isLiveMode = true;
      document.getElementById("live-overlay").classList.remove("hidden");
      document.getElementById("live-status").textContent = "শুনছি... কথা বল ভাই";
      recognition.start();
    };

    document.getElementById("close-live-btn").onclick = () => {
      isLiveMode = false;
      window.speechSynthesis.cancel();
      if (recognition) recognition.stop();
      document.getElementById("live-overlay").classList.add("hidden");
    };
  </script>
</body>
</html>
